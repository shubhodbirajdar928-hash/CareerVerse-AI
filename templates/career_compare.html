<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Side-by-side AI career comparison tool — compare salary, demand, growth, and difficulty with CareerVerse AI.">

    <title>Career Compare AI | CareerVerse AI</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/common.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/career_compare.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>

{% include 'partials/navbar.html' %}

<section class="compare-page reveal">
    <div class="hero-badge">
        <span></span>
        CAREER COMPARE ENGINE
    </div>

    <h1>Compare Career Paths <span>Side by Side</span></h1>
    <p>Compare salary bands, market demand, learning difficulty, growth velocity, and top hiring cities between any two roles.</p>

    <div class="compare-form-container">
        <div class="compare-inputs-grid">
            <div class="compare-input-group">
                <label for="career1"><i class="fa-solid fa-briefcase"></i> Primary Career (Role 1)</label>
                <input type="text" id="career1" class="compare-input" placeholder="e.g. AI Engineer, Software Architect">
            </div>

            <div class="compare-input-group">
                <label for="career2"><i class="fa-solid fa-rocket"></i> Comparison Career (Role 2)</label>
                <input type="text" id="career2" class="compare-input" placeholder="e.g. Data Scientist, Product Manager">
            </div>

            <div class="compare-input-group full-width">
                <label for="country"><i class="fa-solid fa-earth-americas"></i> Target Location / Country (Optional)</label>
                <input type="text" id="country" class="compare-input" placeholder="e.g. India, USA, Japan, Germany">
            </div>
        </div>

        <button id="compareBtn" class="compare-btn" type="button">
            <i class="fa-solid fa-scale-balanced"></i> Compare Careers Now
        </button>
    </div>

    <div id="result" class="compare-results-container"></div>
</section>

{% include 'partials/footer.html' %}

<script src="{{ url_for('static', filename='js/ui-effects.js') }}"></script>
<script src="{{ url_for('static', filename='js/career_compare.js') }}?v=20260806_v5001"></script>

</body>
</html>
