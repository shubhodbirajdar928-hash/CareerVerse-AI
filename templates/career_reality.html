<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Unfiltered day-in-the-life realities, stress levels, and salary scope with CareerVerse AI Career Reality Check.">

    <title>Career Reality AI | CareerVerse AI</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/common.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/career_reality.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>

{% include 'partials/navbar.html' %}

<section class="reality-page reveal">
    <div class="hero-badge">
        <span></span>
        CAREER REALITY ENGINE
    </div>

    <h1>Unfiltered <span>Career Reality Check</span></h1>
    <p>Discover the honest day-in-the-life facts, stress indices, work-life balance, and actual growth trajectories before making your next career pivot.</p>

    <div class="reality-container">
        <div class="reality-inputs-grid">
            <div class="reality-input-group">
                <label for="career"><i class="fa-solid fa-bullseye"></i> Target Career Role</label>
                <input type="text" id="career" class="reality-input" placeholder="e.g. AI Engineer, Investment Banker, Doctor">
            </div>

            <div class="reality-input-group">
                <label for="country"><i class="fa-solid fa-earth-americas"></i> Country / Region (Optional)</label>
                <input type="text" id="country" class="reality-input" placeholder="e.g. India, USA, Japan, Germany">
            </div>
        </div>

        <button id="realityBtn" class="reality-btn" type="button">
            <i class="fa-solid fa-masks-theater"></i> Reveal Unfiltered Career Reality
        </button>
    </div>

    <div id="result" class="reality-result"></div>
</section>

{% include 'partials/footer.html' %}

<script src="{{ url_for('static', filename='js/ui-effects.js') }}"></script>
<script src="{{ url_for('static', filename='js/career_reality.js') }}"></script>

</body>
</html>
